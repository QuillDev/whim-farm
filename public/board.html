<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>herd board · whim.farm</title>
<meta name="description" content="all-time whim.farm cow sim leaderboard, plain text.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
<style>
  body { font-family: ui-monospace, "SF Mono", Menlo, monospace; background: #fffdf7; color: #2b2a28; margin: 0; padding: 24px; }
  h1 { font-family: ui-rounded, system-ui, sans-serif; font-size: 1.6rem; margin: 0 0 4px; }
  p { margin: 4px 0 12px; font-family: ui-rounded, system-ui, sans-serif; opacity: .75; font-size: .9rem; }
  pre { font-size: 1.1rem; line-height: 1.5; margin: 0 0 12px; }
  a { color: inherit; }
</style>
</head>
<body>
<h1>all-time herd board</h1>
<p>kept by the farm, which checks every point. <a href="sim.html">play</a></p>
<pre id="board-text">loading…</pre>
<div id="last-updated">last updated: never</div>
<div id="herd-status">herd: connecting…</div>
<script type="module">
// spectator: reads the farm's board, never plays
const ROOM = new URLSearchParams(location.search).get('room') || 'pasture';
const text = document.getElementById('board-text'), updated = document.getElementById('last-updated'), status = document.getElementById('herd-status');
async function refresh() {
  try {
    const r = await fetch('api/board?room=' + encodeURIComponent(ROOM));
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    text.textContent = d.board.length ? d.board.map(r => `${r.name} ${r.pts}`).join('\n') : 'no scores yet';
    status.textContent = d.live ? `herd: ${d.live} online` : 'herd: nobody online right now';
    updated.textContent = 'last updated: ' + new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  } catch (e) {
    status.textContent = "couldn't reach the farm, trying again";
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
